<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0078ff, #00c6ff);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      padding: 30px;
      width: 380px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      animation: fadeIn 0.4s ease;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0 18px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      transition: border 0.2s;
    }

    input:focus, textarea:focus {
      border-color: #0078ff;
      outline: none;
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #0078ff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #005fcc;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #333;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Send an Email</h2>

    <form id="emailForm">
      <input type="email" id="email" placeholder="Recipient Email" required>
      <input type="text" id="subject" placeholder="Subject" required>
      <textarea id="message" placeholder="Message" required></textarea>
      <button type="submit">Send Email</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    async function sendWithRetry(url, options, retries = 3, delay = 3000) {
      for (let i = 0; i < retries; i++) {
        try {
          const res = await fetch(url, options);
          if (!res.ok) throw new Error("Server error");
          return res;
        } catch (err) {
          if (i === retries - 1) throw err;
          document.getElementById("status").innerText =
            `Server waking up… retrying (${i + 1}/${retries})`;
          await new Promise(r => setTimeout(r, delay));
        }
      }
    }

    document.getElementById("emailForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const status = document.getElementById("status");
      status.innerText = "Sending… please wait";

      const data = {
        to: document.getElementById("email").value,
        subject: document.getElementById("subject").value,
        message: document.getElementById("message").value
      };

      try {
        const res = await sendWithRetry("https://email-form-website-backend.onrender.com/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        status.innerText = await res.text();
      } catch (err) {
        status.innerText = "Failed to send email. Please try again.";
      }
    });
  </script>

</body>
</html>
