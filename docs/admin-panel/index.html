<!DOCTYPE html>
<html>
<head>
  <title>Generate Review Link</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
    }
    button {
      background: #0078ff;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background: #005fcc;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #e8ffe8;
      border: 1px solid #b2ffb2;
      border-radius: 5px;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Generate Personalised Review Link</h2>

  <label>Customer Name</label>
  <input type="text" id="name" placeholder="John Smith">

  <label>Customer Email</label>
  <input type="email" id="email" placeholder="john@example.com">

  <button onclick="generateLink()">Generate Link</button>

  <div id="output" class="result" style="display:none;"></div>
</div>

<script>
async function generateLink() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const output = document.getElementById("output");

  if (!name || !email) {
    alert("Please enter both name and email.");
    return;
  }

  try {
    const response = await fetch("https://review-backend-production-6c56.up.railway.app/generate-review-link", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email })
    });

    const data = await response.json();

    output.style.display = "block";
    output.innerHTML = `
      <strong>Review Link:</strong><br>
      <a href="${data.link}" target="_blank">${data.link}</a>
    `;
  } catch (err) {
    output.style.display = "block";
    output.innerHTML = "Error generating link.";
  }
}
</script>

</body>
</html>
