<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Cousin Group – Review Admin</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    h1 { margin-bottom: 10px; }
    section {
      margin-bottom: 40px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    input, button, textarea, select {
      padding: 8px;
      margin: 5px 0;
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #007bff;
      color: #fff;
    }
    button:hover { opacity: 0.9; }
    #sendEmailBtn {
      display: none;
      margin-top: 10px;
      background: #28a745;
    }
    .output {
      margin-top: 10px;
      font-weight: bold;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <h1>Review Admin Panel</h1>

  <!-- Generate Review Link -->
  <section>
    <h2>Generate Review Link</h2>

    <input id="nameInput" type="text" placeholder="Customer Name">
    <input id="emailInput" type="email" placeholder="Customer Email">

    <button onclick="generateLink()">Generate Link</button>
    <div id="linkOutput" class="output"></div>

    <button id="sendEmailBtn" onclick="sendEmail()">Send Email to Customer</button>
    <div id="sendEmailOutput" class="output"></div>
  </section>

  <!-- Validate Review Token -->
  <section>
    <h2>Validate Review Token</h2>
    <input id="tokenInput" type="text" placeholder="Token or Full Review URL">
    <button onclick="validateToken()">Validate Token</button>
    <div id="tokenOutput" class="output"></div>
  </section>

  <!-- Submit Review (Test Tool) -->
  <section>
    <h2>Submit Review (Test Tool)</h2>

    <input id="reviewToken" type="text" placeholder="Review Token">

    <label>Rating</label>
    <select id="reviewRating">
      <option value="">Select rating</option>
      <option value="5">⭐⭐⭐⭐⭐</option>
      <option value="4">⭐⭐⭐⭐</option>
      <option value="3">⭐⭐⭐</option>
      <option value="2">⭐⭐</option>
      <option value="1">⭐</option>
    </select>

    <textarea id="reviewText" placeholder="Write review..." rows="4"></textarea>

    <button onclick="submitReview()">Submit Review</button>
    <div id="reviewOutput" class="output"></div>
  </section>

  <script>
    const API = "https://review-backend-production-6c56.up.railway.app";

    let lastGenerated = {
      token: null,
      name: null,
      email: null
    };

    // Extract token from raw token OR full URL (robust version)
    function extractToken(input) {
      if (!input) return "";

      // If it's already a plain token (10 chars alphanumeric)
      if (/^[a-z0-9]{10}$/i.test(input.trim())) {
        return input.trim();
      }

      // Try to pull ?token=... from a URL or string
      const match = input.match(/token=([a-z0-9]+)/i);
      if (match) {
        return match[1];
      }

      return input.trim();
    }

    // Generate Review Link
    async function generateLink() {
      const name = document.getElementById("nameInput").value.trim();
      const email = document.getElementById("emailInput").value.trim();
      const output = document.getElementById("linkOutput");
      const sendBtn = document.getElementById("sendEmailBtn");
      const sendOutput = document.getElementById("sendEmailOutput");

      output.textContent = "";
      sendOutput.textContent = "";
      sendBtn.style.display = "none";

      if (!email) {
        output.textContent = "Email is required.";
        return;
      }

      try {
        const res = await fetch(`${API}/generate-review-link`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email })
        });

        const data = await res.json();
        if (data.link) {
          output.textContent = data.link;

          const token = extractToken(data.link);
          lastGenerated = { token, name, email };

          sendBtn.style.display = "inline-block";
        } else {
          output.textContent = data.error || "Failed to generate link.";
        }
      } catch (err) {
        output.textContent = "Error: " + err.message;
      }
    }

    // Send Email to Customer (uses existing token)
    async function sendEmail() {
      const output = document.getElementById("sendEmailOutput");

      if (!lastGenerated.token || !lastGenerated.email) {
        output.textContent = "No token or email available.";
        return;
      }

      try {
        const res = await fetch(`${API}/send-review-email`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token: lastGenerated.token,
            name: lastGenerated.name,
            email: lastGenerated.email
          })
        });

        const data = await res.json();
        output.textContent = data.message || data.error || "Unknown response.";
      } catch (err) {
        output.textContent = "Error: " + err.message;
      }
    }

    // Validate Token
    async function validateToken() {
      const raw = document.getElementById("tokenInput").value;
      const token = extractToken(raw);
      const output = document.getElementById("tokenOutput");
      output.textContent = "";

      if (!token) {
        output.textContent = "Please enter a token or URL.";
        return;
      }

      try {
        const res = await fetch(`${API}/review-token/${token}`);
        const data = await res.json();
        output.textContent = data.valid ? "Valid Token" : "Invalid Token";
      } catch (err) {
        output.textContent = "Error: " + err.message;
      }
    }

    // Submit Review (Test Tool)
    async function submitReview() {
      const rawToken = document.getElementById("reviewToken").value;
      const token = extractToken(rawToken);
      const rating = document.getElementById("reviewRating").value;
      const comments = document.getElementById("reviewText").value.trim();
      const output = document.getElementById("reviewOutput");
      output.textContent = "";

      if (!token || !rating || !comments) {
        output.textContent = "Token, rating and comments are required.";
        return;
      }

      try {
        const res = await fetch(`${API}/review`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, rating, comments })
        });

        const data = await res.json();
        output.textContent = data.message || data.error || "Unknown response.";
      } catch (err) {
        output.textContent = "Error: " + err.message;
      }
    }
  </script>

</body>
</html>
